<div class="pagina">

    <div class="formulario-container">

        <div class="cabecalho-formulario">
            <div>
                <span class="eyebrow">
                    {{ editando ? 'MINHA COLEÇÃO' : 'NOVA ADIÇÃO' }}
                </span>

                <h1>
                    {{ editando ? 'Editar esmalte' : 'Cadastrar esmalte' }}
                </h1>

                <p>
                    {{ editando
                    ? 'Atualize as informações do seu esmalte.'
                    : 'Adicione um novo esmalte à sua coleção.'
                    }}
                </p>
            </div>

            <a routerLink="/" class="btn-voltar">
                ← Voltar para coleção
            </a>
        </div>

        <form class="card-formulario" (ngSubmit)="salvarEsmalte()">

            <div class="formulario-grid">

                <div class="campo">
                    <label for="nome">
                        Nome do esmalte
                    </label>

                    <input id="nome" type="text" name="nome" class="form-control" [(ngModel)]="novoEsmalte.nome"
                        placeholder="Ex.: Vermelho Paixão" />
                </div>

                <div class="campo">
                    <label for="marca">
                        Marca
                    </label>

                    <input id="marca" type="text" name="marca" class="form-control" [(ngModel)]="novoEsmalte.marca"
                        placeholder="Ex.: Risqué" />
                </div>

                <div class="campo">
                    <label for="dataVencimento">
                        Data de vencimento
                    </label>

                    <input id="dataVencimento" type="date" name="dataVencimento" class="form-control"
                        [(ngModel)]="novoEsmalte.dataVencimento" />
                </div>

                <div class="campo">
                    <label for="caminhoImagem">
                        URL da imagem
                    </label>

                    <input id="caminhoImagem" type="url" name="caminhoImagem" class="form-control"
                        [(ngModel)]="novoEsmalte.caminhoImagem" placeholder="https://..." />
                </div>

                <div class="campo campo-observacoes">
                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea id="observacoes" name="observacoes" class="form-control"
                        [(ngModel)]="novoEsmalte.observacoes" placeholder="Ex.: Cor favorita, acabamento, coleção..."
                        rows="5"></textarea>
                </div>

            </div>

            <div *ngIf="erroCadastro" class="erro-cadastro">
                {{ erroCadastro }}
            </div>

            <div class="acoes-formulario">

                <a routerLink="/" class="btn btn-cancelar">
                    Cancelar
                </a>

                <button type="submit" class="btn btn-salvar" [disabled]="cadastrando">
                    <span *ngIf="!cadastrando">
                        {{ editando ? 'Salvar alterações' : 'Cadastrar esmalte' }}
                    </span>

                    <span *ngIf="cadastrando">
                        Salvando...
                    </span>
                </button>

            </div>

        </form>

    </div>

</div>
