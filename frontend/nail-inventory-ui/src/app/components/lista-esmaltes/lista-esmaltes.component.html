<h1>Meu Estoque de Esmaltes</h1>

<div>
    <label for="marca">Marca:</label>

    <select id="marca" [(ngModel)]="marcaSelecionada" (change)="carregarEsmaltes()">
        <option value="">Todas</option>

        <option *ngFor="let marca of marcas" [value]="marca">
            {{ marca }}
        </option>
    </select>

    <label for="vencimento">Vencimento até:</label>

    <input id="vencimento" type="date" [(ngModel)]="vencimentoAte" (change)="carregarEsmaltes()" />

    <button type="button" (click)="limparFiltros()">
        Limpar filtros
    </button>
</div>

<hr>

<p *ngIf="carregando">
    Carregando esmaltes...
</p>

<p *ngIf="erro">
    {{ erro }}
</p>

<p *ngIf="!carregando && !erro">
    {{ esmaltes.length }} esmaltes encontrados
</p>

<div *ngFor="let esmalte of esmaltes">
    <h2>{{ esmalte.nome }}</h2>

    <p>
        Marca: {{ esmalte.marca }}
    </p>

    <p *ngIf="esmalte.dataVencimento">
        Vencimento: {{ esmalte.dataVencimento | date:'MM/yyyy' }}
    </p>

    <p *ngIf="esmalte.observacoes">
        {{ esmalte.observacoes }}
    </p>
</div>
